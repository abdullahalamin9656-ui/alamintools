<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Calculator</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:#050816;color:#f2f5ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px 14px 40px;overflow-x:hidden;
background-image:radial-gradient(600px 420px at 85% 0,rgba(255,90,40,.18),transparent),radial-gradient(600px 460px at 0 55%,rgba(60,90,255,.22),transparent)}
.top{width:min(380px,100%);display:flex;justify-content:space-between;align-items:center}
.top a{color:#9fb0d8;font-size:14px;text-decoration:none}
#snd{background:none;border:0;font-size:22px;cursor:pointer;color:#fff}
h1{font-size:22px;margin:6px 0 18px}
.scene{perspective:1000px;width:min(360px,92vw)}
.calc{transform-style:preserve-3d;transform:rotateX(7deg) rotateY(-7deg);transition:transform .15s ease-out;padding:16px;border-radius:30px;
background:linear-gradient(160deg,#1c2558,#0b1030);border:1px solid rgba(130,160,255,.35);
box-shadow:0 1px 0 #2a3580,0 2px 0 #263070,0 3px 0 #222b64,0 4px 0 #1e2658,0 5px 0 #1a214c,0 30px 50px rgba(0,0,0,.55),0 0 50px rgba(90,100,255,.3)}
.screen{background:linear-gradient(180deg,#050a22,#0d1538);border-radius:18px;padding:12px 16px;margin-bottom:16px;box-shadow:inset 0 4px 14px rgba(0,0,0,.7);transform:translateZ(18px);min-height:108px;display:flex;flex-direction:column;justify-content:space-between;text-align:right}
.small{font-size:14px;color:#7f93c9;height:20px;white-space:nowrap;overflow:hidden}
.big{font:700 46px ui-monospace,Menlo,Consolas,monospace;white-space:nowrap;overflow-x:auto;scrollbar-width:none;text-shadow:0 0 14px rgba(90,160,255,.7)}
.big::-webkit-scrollbar{display:none}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;transform-style:preserve-3d}
.key{--k:47,60,140;touch-action:manipulation;user-select:none;border:0;border-radius:16px;height:58px;font:700 22px system-ui;color:#fff;cursor:pointer;
background:linear-gradient(180deg,rgba(var(--k),1),rgba(var(--k),.72));transform:translateZ(14px);
box-shadow:0 6px 0 rgba(0,0,0,.5),0 12px 18px rgba(var(--k),.4),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .07s,box-shadow .07s,filter .2s}
.key.f{--k:70,90,190}.key.o{--k:255,110,40}.key.r{--k:255,61,113}.key.d{--k:240,170,30}.key.e{--k:30,200,120}
.key:active,.key.hit{transform:translateZ(14px) translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.5),0 0 26px rgba(255,140,30,.95),inset 0 1px 0 rgba(255,255,255,.35);filter:brightness(1.3)}
.hist{width:min(380px,100%);margin-top:26px}
.hist h2{font-size:14px;color:#9fb0d8;font-weight:600;margin-bottom:6px}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;margin-bottom:6px;border-radius:12px;background:#111836;border:1px solid #232d63;font-family:ui-monospace,Menlo,monospace;font-size:14px;cursor:pointer}
.hist div b{color:#ffb020}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50;filter:blur(1.2px) saturate(1.3)}
</style>
</head>
<body>
<div class="top"><a href="index.html">← All tools</a><button id="snd" aria-label="Sound">🔊</button></div>
<h1>3D Calculator</h1>
<div class="scene"><div class="calc" id="calc">
  <div class="screen" id="screen"><div class="small" id="small"></div><div class="big" id="big">0</div></div>
  <div class="keys" id="keys"></div>
</div></div>
<div class="hist" id="hist" hidden><h2>History</h2><div id="hl" style="display:block;padding:0;border:0;background:none;cursor:default"></div></div>
<canvas id="fx"></canvas>
<script>
(function(){
function calc(str){
  var s=str.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/\s/g,''),i=0;
  function pk(){return s[i]}
  function ex(){var v=tm();while(pk()==='+'||pk()==='-'){var o=s[i++],r=tm();v=o==='+'?v+r:v-r}return v}
  function tm(){var v=un();while(pk()==='*'||pk()==='/'){var o=s[i++],r=un();v=o==='*'?v*r:v/r}return v}
  function un(){if(pk()==='-'){i++;return -un()}if(pk()==='+'){i++;return un()}
    if(pk()==='√'){i++;var v=un();if(v<0)throw 0;return Math.sqrt(v)}return po()}
  function po(){var v=pr();while(pk()==='%'||pk()==='²'){v=s[i++]==='%'?v/100:v*v}return v}
  function pr(){if(pk()==='('){i++;var v=ex();if(pk()!==')')throw 0;i++;return v}
    var m=/^(\d+\.?\d*|\.\d+)(e[+-]?\d+)?/.exec(s.slice(i));if(!m)throw 0;i+=m[0].length;return parseFloat(m[0])}
  var v=ex();if(i!==s.length||!isFinite(v))throw 0;return v}
/*end calc*/
var $=function(i){return document.getElementById(i)};
var big=$('big'),small=$('small'),keysEl=$('keys'),hl=$('hl'),hist=$('hist'),calcEl=$('calc'),cv=$('fx'),cx=cv.getContext('2d');
var expr='',eq=false,last='',H=[];
var L=[['(','f'],[')','f'],['√','f'],['²','f'],['AC','r'],['DEL','d'],['%','f'],['÷','o'],['7'],['8'],['9'],['×','o'],['4'],['5'],['6'],['−','o'],['1'],['2'],['3'],['+','o'],['00'],['0'],['.'],['=','e']];
L.forEach(function(k){var b=document.createElement('button');b.className='key '+(k[1]||'');b.textContent=k[0];b.setAttribute('data-k',k[0]);keysEl.appendChild(b);
  b.addEventListener('pointerdown',function(e){e.preventDefault();press(k[0],b)})});
var AC=window.AudioContext||window.webkitAudioContext,ac=null,on=true;
function tone(f,d,t,v){if(!on||!AC)return;try{ac=ac||new AC();if(ac.state==='suspended')ac.resume();var o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;o.type=t||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.15,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d)}catch(e){}}
$('snd').onclick=function(){on=!on;$('snd').textContent=on?'🔊':'🔇';tone(600,.08)};
function fmt(v){var r=parseFloat(v.toPrecision(12)),t=Math.abs(r)>=1e15||(r!==0&&Math.abs(r)<1e-7)?r.toExponential(6):String(r);return t.replace('-','−')}
function isOp(c){return c==='+'||c==='−'||c==='×'||c==='÷'||c==='-'}
function isVal(c){return /[0-9)%²]/.test(c)}
function preview(){var o=(expr.match(/\(/g)||[]).length-(expr.match(/\)/g)||[]).length;
  if(!/[+−×÷%²√(]/.test(expr.slice(expr.charAt(0)==='−'?1:0)))return '';
  try{return fmt(calc(expr+(o>0?Array(o+1).join(')'):'')))}catch(e){return ''}}
function render(){
  var t=expr||'0';big.textContent=t;big.style.fontSize=t.length>14?'26px':t.length>10?'34px':'46px';big.scrollLeft=big.scrollWidth;
  if(eq)small.textContent=last;else{var p=preview();small.textContent=p&&p!==expr?'= '+p:''}
}
function press(k,btn){
  if(btn)fire(btn);
  tone(/\d|\./.test(k)?520:k==='='?880:k==='AC'?280:700,.07,'triangle');
  var c=expr.slice(-1);
  if(/^(\d|00|\.)$/.test(k)||k==='00'){
    if(eq){expr='';eq=false;c=''}
    if(k==='.'){var seg=expr.split(/[+−×÷()√]/).pop();if(seg.indexOf('.')>-1)return render();if(!seg)k='0.'}
    if(c===')'||c==='%'||c==='²')expr+='×';
    expr+=k;
  }else if(isOp(k)){
    if(!expr){if(k==='−')expr='−';return render()}
    if(eq)eq=false;
    if(c==='('&&k!=='−')return render();
    if(isOp(c)){if(expr.length===1)return render();expr=expr.slice(0,-1)}
    expr+=k;
  }else if(k==='('){if(eq){expr='';eq=false}if(isVal(expr.slice(-1)))expr+='×';expr+='('}
  else if(k===')'){var o=(expr.match(/\(/g)||[]).length-(expr.match(/\)/g)||[]).length;if(o>0&&isVal(c))expr+=')'}
  else if(k==='√'){if(eq){expr='';eq=false}if(isVal(expr.slice(-1)))expr+='×';expr+='√'}
  else if(k==='%'||k==='²'){if(isVal(c))expr+=k;eq=false}
  else if(k==='DEL'){if(eq){expr='';eq=false}else expr=expr.slice(0,-1)}
  else if(k==='AC'){expr='';eq=false}
  else if(k==='='){
    if(!expr||eq)return;
    var o2=(expr.match(/\(/g)||[]).length-(expr.match(/\)/g)||[]).length,src=expr+(o2>0?Array(o2+1).join(')'):'');
    try{var r=fmt(calc(src));last=src+' =';H.unshift({e:src,r:r});H=H.slice(0,6);expr=r;eq=true;tone(1040,.18,'sine',.2);drawH()}
    catch(e){calcEl.classList.remove('shake');void calcEl.offsetWidth;calcEl.classList.add('shake');tone(150,.25,'sawtooth',.2);big.textContent='Error';small.textContent='';return}
  }
  render();
}
function drawH(){hist.hidden=!H.length;hl.innerHTML='';H.forEach(function(h){var d=document.createElement('div');d.style.cssText='display:flex;justify-content:space-between;gap:10px;padding:9px 12px;margin-bottom:6px;border-radius:12px;background:#111836;border:1px solid #232d63;font-family:ui-monospace,Menlo,monospace;font-size:14px;cursor:pointer';
  var a=document.createElement('span'),b=document.createElement('b');a.textContent=h.e;b.textContent='= '+h.r;b.style.color='#ffb020';d.append(a,b);
  d.onclick=function(){expr=h.r;eq=false;render()};hl.appendChild(d)})}
/* fire */
var ps=[],run=false;
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener('resize',size);
function fire(btn){var r=btn.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height*.35;
  btn.classList.add('hit');setTimeout(function(){btn.classList.remove('hit')},140);
  for(var i=0;i<46;i++)ps.push({x:x+(Math.random()-.5)*r.width*.7,y:y,vx:(Math.random()-.5)*1.8,vy:-(1.2+Math.random()*3.4),s:7+Math.random()*11,l:1,p:Math.random()*6});
  if(!run){run=true;anim()}}
function anim(){cx.clearRect(0,0,cv.width,cv.height);cx.globalCompositeOperation='lighter';
  ps=ps.filter(function(p){p.p+=.25;p.x+=p.vx+Math.sin(p.p)*.6;p.y+=p.vy;p.vy*=.985;p.l-=.028;p.s*=.965;if(p.l<=0)return false;
    var c=p.l>.7?'255,225,90':p.l>.4?'255,120,20':'210,40,10';
    cx.fillStyle='rgba('+c+','+(p.l*.9).toFixed(2)+')';cx.beginPath();cx.arc(p.x,p.y,p.s,0,6.283);cx.fill();return true});
  if(ps.length)requestAnimationFrame(anim);else{run=false;cx.clearRect(0,0,cv.width,cv.height)}}
/* keyboard + tilt */
addEventListener('keydown',function(e){
  var m={'*':'×','/':'÷','-':'−','Enter':'=','Backspace':'DEL','Escape':'AC'},k=m[e.key]||e.key;
  var b=keysEl.querySelector('[data-k="'+k+'"]');
  if(b&&!e.ctrlKey&&!e.metaKey){e.preventDefault();press(k,b)}});
addEventListener('mousemove',function(e){var dx=(e.clientX/innerWidth-.5),dy=(e.clientY/innerHeight-.5);
  calcEl.style.transform='rotateX('+(7-dy*16).toFixed(1)+'deg) rotateY('+(-7+dx*20).toFixed(1)+'deg)'});
render();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D Stopwatch</title>
<style>
:root{--bg:#eef1f7;--fg:#1b2233;--face:#fff;--ring:#c9d2e6;--side:#9aa6c4;--accent:#e5484d;--btn:#2f6bff;--btnfg:#fff;--card:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1320;--fg:#e8ecf8;--face:#1a2036;--ring:#2c3558;--side:#0a0d18;--accent:#ff6b70;--btn:#5b8dff;--card:#1a2036}}
:root[data-theme="dark"]{--bg:#0f1320;--fg:#e8ecf8;--face:#1a2036;--ring:#2c3558;--side:#0a0d18;--accent:#ff6b70;--btn:#5b8dff;--card:#1a2036}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:20px 16px 32px}
h1{font-size:18px;margin:0 0 8px;font-weight:600;letter-spacing:.5px}
.scene{perspective:900px;width:min(300px,80vw);aspect-ratio:1;margin:24px 0}
.watch{position:relative;width:100%;height:100%;transform-style:preserve-3d;transform:rotateX(18deg) rotateY(-14deg);transition:transform .15s ease-out}
.layer{position:absolute;inset:0;border-radius:50%}
.layer.l0{transform:translateZ(-24px);background:var(--side);box-shadow:0 40px 50px rgba(0,0,0,.35)}
.layer.l1{transform:translateZ(-12px);background:var(--side)}
.layer.l2{transform:translateZ(0);background:var(--ring)}
.layer.l3{inset:8%;transform:translateZ(6px);background:var(--face);box-shadow:inset 0 4px 12px rgba(0,0,0,.18)}
svg{position:absolute;inset:0;width:100%;height:100%;transform:translateZ(10px)}
.hand{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;transform:translateZ(22px)}
.hand i{position:absolute;left:-2px;bottom:0;width:4px;height:38%;min-height:90px;border-radius:2px;background:var(--accent);transform-origin:50% 100%;transform:translateY(0) rotate(0deg);box-shadow:3px 6px 6px rgba(0,0,0,.3)}
.pin{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px;border-radius:50%;background:var(--fg);transform:translateZ(34px)}
.digits{position:absolute;left:0;right:0;top:62%;text-align:center;font:700 28px ui-monospace,Menlo,Consolas,monospace;transform:translateZ(30px);text-shadow:1px 1px 0 var(--ring),2px 2px 0 var(--ring),3px 3px 0 var(--side),4px 6px 8px rgba(0,0,0,.35)}
.digits small{font-size:18px;opacity:.7}
.btns{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:8px}
button{font:600 16px inherit;font-family:inherit;border:0;border-radius:12px;padding:12px 22px;background:var(--btn);color:var(--btnfg);cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
button.sec{background:var(--card);color:var(--fg)}
button.stop{background:var(--accent)}
.laps{width:min(360px,100%);margin-top:22px;background:var(--card);border-radius:14px;padding:6px 14px;max-height:220px;overflow-y:auto}
.laps div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--ring);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px}
.laps div:last-child{border:0}
.hint{margin-top:14px;font-size:12px;opacity:.6;text-align:center}
</style>
</head>
<body>
<a href="index.html" style="color:inherit;font-size:14px;opacity:.7;text-decoration:none;align-self:flex-start">← All tools</a>
<h1>3D Stopwatch</h1>
<div class="scene" id="scene">
  <div class="watch" id="watch">
    <div class="layer l0"></div><div class="layer l1"></div><div class="layer l2"></div><div class="layer l3"></div>
    <svg viewBox="-100 -100 200 200" id="ticks"></svg>
    <div class="hand"><i id="hand"></i></div>
    <div class="pin"></div>
    <div class="digits" id="digits">00:00<small>.00</small></div>
  </div>
</div>
<div class="btns">
  <button id="go">Start</button>
  <button id="lap" class="sec">Lap</button>
  <button id="reset" class="sec">Reset</button>
  <button id="snd" class="sec">Sound: On</button>
</div>
<div class="laps" id="laps" hidden></div>
<div class="hint">Move mouse or finger over the watch to tilt it · Space = Start/Stop · L = Lap · R = Reset</div>
<script>
(function(){
  var ticks=document.getElementById('ticks'),s='';
  for(var i=0;i<60;i++){var a=i*6*Math.PI/180,big=i%5===0,r1=big?78:84,r2=90;
    s+='<line x1="'+(Math.sin(a)*r1).toFixed(2)+'" y1="'+(-Math.cos(a)*r1).toFixed(2)+'" x2="'+(Math.sin(a)*r2).toFixed(2)+'" y2="'+(-Math.cos(a)*r2).toFixed(2)+'" stroke="currentColor" stroke-width="'+(big?2.2:1)+'" opacity="'+(big?1:.5)+'"/>';
    if(big){s+='<text x="'+(Math.sin(a)*66).toFixed(2)+'" y="'+(-Math.cos(a)*66+4).toFixed(2)+'" font-size="11" text-anchor="middle" fill="currentColor" font-family="system-ui">'+(i===0?60:i)+'</text>';}}
  ticks.innerHTML=s;ticks.style.color='var(--fg)';

  var digits=document.getElementById('digits'),hand=document.getElementById('hand'),
      go=document.getElementById('go'),lapBtn=document.getElementById('lap'),resetBtn=document.getElementById('reset'),
      lapsEl=document.getElementById('laps'),watch=document.getElementById('watch');
  var running=false,start=0,elapsed=0,raf=0,laps=[],lastLap=0;
  var AC=window.AudioContext||window.webkitAudioContext,actx=null,soundOn=true,lastSec=0;
  function beep(f,d,v){if(!soundOn||!AC)return;try{actx=actx||new AC();if(actx.state==='suspended')actx.resume();var o=actx.createOscillator(),g=actx.createGain(),n=actx.currentTime;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(v||.25,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(actx.destination);o.start(n);o.stop(n+d)}catch(e){}}
  var sndBtn=document.getElementById('snd');
  sndBtn.onclick=function(){soundOn=!soundOn;sndBtn.textContent='Sound: '+(soundOn?'On':'Off');beep(700,.08)};

  function pad(n,l){n=String(n);while(n.length<(l||2))n='0'+n;return n}
  function fmt(ms){var m=Math.floor(ms/60000),sec=Math.floor(ms/1000)%60,cs=Math.floor(ms/10)%100;return{main:pad(m)+':'+pad(sec),cs:pad(cs)}}
  function fmtFull(ms){var f=fmt(ms);return f.main+'.'+f.cs}
  function render(){
    var t=running?elapsed+performance.now()-start:elapsed,f=fmt(t);
    digits.innerHTML=f.main+'<small>.'+f.cs+'</small>';
    hand.style.transform='rotate('+((t/1000)%60*6)+'deg)';
    return t;
  }
  function loop(){var t=render(),sc=Math.floor(t/1000);if(sc!==lastSec){lastSec=sc;if(sc>0)beep(1200,.03,.08)}raf=requestAnimationFrame(loop)}
  function toggle(){
    if(running){elapsed+=performance.now()-start;running=false;cancelAnimationFrame(raf);render();go.textContent='Resume';go.classList.remove('stop');beep(440,.15)}
    else{start=performance.now();running=true;lastSec=Math.floor(elapsed/1000);beep(880,.15);loop();go.textContent='Stop';go.classList.add('stop')}
  }
  function lap(){
    if(!running)return;var t=render();
    laps.unshift({n:laps.length+1,total:t,split:t-lastLap});lastLap=t;drawLaps();beep(660,.1)
  }
  function drawLaps(){
    lapsEl.hidden=!laps.length;
    lapsEl.innerHTML=laps.map(function(l){return '<div><span>Lap '+l.n+'</span><span>'+fmtFull(l.split)+'</span><span>'+fmtFull(l.total)+'</span></div>'}).join('');
  }
  function reset(){
    running=false;cancelAnimationFrame(raf);elapsed=0;lastLap=0;laps=[];drawLaps();
    go.textContent='Start';go.classList.remove('stop');render();beep(300,.15);
  }
  go.onclick=toggle;lapBtn.onclick=lap;resetBtn.onclick=reset;
  document.addEventListener('keydown',function(e){
    if(e.code==='Space'){e.preventDefault();toggle()}
    else if(e.key==='l'||e.key==='L')lap();
    else if(e.key==='r'||e.key==='R')reset();
  });
  function tilt(x,y){
    var r=document.getElementById('scene').getBoundingClientRect(),
        dx=(x-(r.left+r.width/2))/window.innerWidth,dy=(y-(r.top+r.height/2))/window.innerHeight;
    watch.style.transform='rotateX('+(-dy*50).toFixed(1)+'deg) rotateY('+(dx*60).toFixed(1)+'deg)';
  }
  window.addEventListener('mousemove',function(e){tilt(e.clientX,e.clientY)});
  window.addEventListener('touchmove',function(e){var t=e.touches[0];tilt(t.clientX,t.clientY)},{passive:true});
  render();
})();
</script>
</body>
</html>
